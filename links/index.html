<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAHAR STUDIO — روابط</title>
<meta name="description" content="حمّل مهجورة من Google Play، وتعرّف على ألعاب بحر ستديو.">
<meta property="og:title" content="مهجورة — متوفرة الآن على Google Play">
<meta property="og:image" content="https://bahar-studio.github.io/img/mahjoora_key.jpg">
<link rel="icon" href="../img/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#05060c;--line:#232a45;--txt:#ece7dc;--dim:#a3a9bb;--red:#d81f1f;--gold:#c9a35b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);font-family:Tajawal,system-ui,sans-serif;display:flex;justify-content:center}
.bg{position:fixed;inset:0;background:url(../img/mahjoora_1.jpg) center/cover;opacity:.22;filter:blur(2px) saturate(.9)}
.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(#05060ccc,#05060c 85%)}
main{position:relative;width:min(460px,100% - 32px);padding:44px 0 36px;text-align:center}
.logo{width:120px;height:auto;border-radius:16px;margin:0 auto 14px;display:block;box-shadow:0 0 30px #38e1ff33}
h1{font-size:15px;letter-spacing:6px;color:var(--gold);margin:0 0 4px;font-weight:800;direction:ltr}
.tag{color:var(--dim);font-size:15px;margin:0 0 30px}

.feature{display:block;border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:16px;background:#0c0f1c;text-decoration:none;color:inherit}
.feature img{width:100%;aspect-ratio:16/8;object-fit:cover;display:block}
.feature .cap{padding:12px 16px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.feature b{font-size:20px}
.feature span{font-size:13px;color:#6dffa6;border:1px solid #1d6b40;background:#0f3d24;border-radius:20px;padding:2px 10px;white-space:nowrap}

a.btn{display:flex;align-items:center;gap:14px;padding:16px 18px;margin-bottom:12px;border-radius:14px;border:1px solid var(--line);background:#0c0f1ccc;color:var(--txt);text-decoration:none;font-size:18px;font-weight:500;transition:.15s}
a.btn:hover{border-color:var(--gold);transform:translateY(-1px)}
a.btn.main{background:var(--red);border-color:var(--red);color:#fff;font-weight:800}
a.btn.main:hover{background:#ee2a2a}
a.btn svg{width:24px;height:24px;flex:none}
a.btn .go{margin-right:auto;opacity:.6}
footer{margin-top:26px;color:#6b7186;font-size:13px;letter-spacing:1px}
</style>
</head>
<body>
<div class="bg"></div>
<main>
  <img class="logo" src="../img/bahar_logo.jpg" alt="BAHAR STUDIO">
  <h1>BAHAR STUDIO</h1>
  <p class="tag">ألعاب من البحرين، مستوحاة من قصصنا</p>

  <a class="feature" href="https://play.google.com/store/apps/details?id=com.bahrgames.mahjoora">
    <img src="../img/mahjoora_key.jpg" alt="مهجورة">
    <div class="cap"><b>مهجورة</b><span>متوفرة الآن</span></div>
  </a>

  <a class="btn main" href="https://play.google.com/store/apps/details?id=com.bahrgames.mahjoora">
    <svg viewBox="0 0 40 44"><path d="M2 1.5 23 22 2 42.5c-.7-.4-1-1.2-1-2.1V3.6c0-.9.3-1.7 1-2.1z" fill="#fff"/><path d="m30 15.2-7 6.8 7 6.8 8-4.5c2.2-1.3 2.2-3.4 0-4.6z" fill="#fff" opacity=".8"/><path d="M23 22 2 42.5c.8.4 1.8.3 2.8-.3L30 28.8z" fill="#fff" opacity=".65"/><path d="M2 1.5c.8-.4 1.8-.3 2.8.3L30 15.2 23 22z" fill="#fff" opacity=".9"/></svg>
    حمّل مهجورة من Google Play
    <span class="go">‹</span>
  </a>

  <a class="btn" href="../#mahjoora">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="20" height="12" rx="4"/><path d="M7 10v4M5 12h4"/><circle cx="16" cy="11" r="1" fill="currentColor"/><circle cx="18" cy="13" r="1" fill="currentColor"/></svg>
    صفحة اللعبة: القصة والصور
    <span class="go">‹</span>
  </a>

  <a class="btn" href="../">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>
    موقع بحر ستديو
    <span class="go">‹</span>
  </a>

  <footer>© ٢٠٢٦ BAHAR STUDIO</footer>
</main>
</body>
</html>
